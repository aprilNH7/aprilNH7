<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c0c0c0" />
      <stop offset="100%" stop-color="#808080" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a" />

  <!-- Falling nodes -->
  <g filter="url(#glow)">
    <circle cx="120" cy="0" r="3" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="0" r="4" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="5.1s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5.1s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="0" r="2.5" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="0" r="3.5" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.7s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.7s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="0" r="4" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="5.5s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5.5s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="0" r="3" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.0s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.0s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="0" r="2.5" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="3.5s" begin="2.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" begin="2.0s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="0" r="3" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.9s" begin="1.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.9s" begin="1.0s" repeatCount="indefinite" />
    </circle>
    <circle cx="470" cy="0" r="4" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="5.8s" begin="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="5.8s" begin="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="610" cy="0" r="2.5" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.3s" begin="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.3s" begin="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="0" r="3.5" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="3.6s" begin="2.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="0" r="3" fill="url(#silverGrad)">
      <animate attributeName="cy" from="-10" to="310" dur="4.5s" begin="3.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="3.3s" repeatCount="indefinite" />
    </circle>

    <!-- Connection lines -->
    <line x1="120" y1="40" x2="260" y2="120" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="40;80;120;160" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="120;160;200;240" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="260" y1="60" x2="400" y2="150" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="60;100;140;180" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="150;190;230;270" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="30" x2="540" y2="110" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="30;70;110;150" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="y2" values="110;150;190;230" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="3.8s" repeatCount="indefinite" />
    </line>
    <line x1="540" y1="80" x2="680" y2="170" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="80;120;160;200" dur="5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="170;210;250;290" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="680" y1="50" x2="820" y2="140" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="50;90;130;170" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="140;180;220;260" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4.2s" repeatCount="indefinite" />
    </line>
    <line x1="180" y1="90" x2="330" y2="180" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="90;130;170;210" dur="4.7s" repeatCount="indefinite" />
      <animate attributeName="y2" values="180;220;260;300" dur="4.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="4.7s" repeatCount="indefinite" />
    </line>
    <line x1="330" y1="40" x2="470" y2="130" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="40;80;120;160" dur="3.9s" repeatCount="indefinite" />
      <animate attributeName="y2" values="130;170;210;250" dur="3.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="3.9s" repeatCount="indefinite" />
    </line>
    <line x1="470" y1="70" x2="610" y2="160" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="70;110;150;190" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="160;200;240;280" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="5.2s" repeatCount="indefinite" />
    </line>
    <line x1="610" y1="100" x2="750" y2="190" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="100;140;180;220" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="190;230;270;310" dur="4.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0.5;0" dur="4.4s" repeatCount="indefinite" />
    </line>
    <line x1="750" y1="60" x2="900" y2="150" stroke="#c0c0c0" stroke-width="0.8" opacity="0.4">
      <animate attributeName="y1" values="60;100;140;180" dur="4.1s" repeatCount="indefinite" />
      <animate attributeName="y2" values="150;190;230;270" dur="4.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0.4;0" dur="4.1s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
